name: CI-CD Conecta Solidaria ESG

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conecta-solidaria-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: conecta-solidaria-esg
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build e testes automatizados
        run: mvn -B clean test package

      - name: Publicar relatorios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
          name: esgapi-jar
          path: target/esgapi.jar

  docker-build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagem
        run: docker build -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Exportar imagem para o pipeline
        run: docker save $IMAGE_NAME:$IMAGE_TAG | gzip > conecta-solidaria-image.tar.gz

      - name: Publicar imagem como artefato
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: conecta-solidaria-image.tar.gz

  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name != 'pull_request'
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar imagem Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Carregar imagem Docker
        run: gunzip -c conecta-solidaria-image.tar.gz | docker load

      - name: Configurar variaveis de staging
        shell: bash
        env:
          SECRET_DB_URL: ${{ secrets.DB_URL }}
          SECRET_DB_USERNAME: ${{ secrets.DB_USERNAME }}
          SECRET_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECRET_API_ADMIN_USER: ${{ secrets.API_ADMIN_USER }}
          SECRET_API_ADMIN_PASSWORD: ${{ secrets.API_ADMIN_PASSWORD }}
          SECRET_API_USER: ${{ secrets.API_USER }}
          SECRET_API_USER_PASSWORD: ${{ secrets.API_USER_PASSWORD }}
        run: |
          {
            printf 'DB_URL=%s\n' "$SECRET_DB_URL"
            printf 'DB_USERNAME=%s\n' "$SECRET_DB_USERNAME"
            printf 'DB_PASSWORD=%s\n' "$SECRET_DB_PASSWORD"
            printf 'API_ADMIN_USER=%s\n' "$SECRET_API_ADMIN_USER"
            printf 'API_ADMIN_PASSWORD=%s\n' "$SECRET_API_ADMIN_PASSWORD"
            printf 'API_USER=%s\n' "$SECRET_API_USER"
            printf 'API_USER_PASSWORD=%s\n' "$SECRET_API_USER_PASSWORD"
            printf 'IMAGE_NAME=%s\n' "$IMAGE_NAME"
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG"
          } > .env

      - name: Subir ambiente staging
        run: docker compose --profile staging up -d --no-build app-staging

      - name: Aguardar e validar staging
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8081/actuator/health | grep -q '"status":"UP"'; then
              echo "Staging UP"
              exit 0
            fi
            sleep 10
          done
          docker compose --profile staging logs app-staging
          exit 1

      - name: Salvar logs de staging
        if: always()
        run: |
          mkdir -p artifacts
          docker compose --profile staging logs --no-color app-staging > artifacts/staging.log || true

      - name: Publicar logs de staging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-logs
          path: artifacts/staging.log

      - name: Encerrar ambiente de staging
        if: always()
        run: docker compose --profile staging down || true

  deploy-production:
    name: Deploy producao
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar imagem Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Carregar imagem Docker
        run: gunzip -c conecta-solidaria-image.tar.gz | docker load

      - name: Configurar variaveis de producao
        shell: bash
        env:
          SECRET_DB_URL: ${{ secrets.DB_URL }}
          SECRET_DB_USERNAME: ${{ secrets.DB_USERNAME }}
          SECRET_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECRET_API_ADMIN_USER: ${{ secrets.API_ADMIN_USER }}
          SECRET_API_ADMIN_PASSWORD: ${{ secrets.API_ADMIN_PASSWORD }}
          SECRET_API_USER: ${{ secrets.API_USER }}
          SECRET_API_USER_PASSWORD: ${{ secrets.API_USER_PASSWORD }}
        run: |
          {
            printf 'DB_URL=%s\n' "$SECRET_DB_URL"
            printf 'DB_USERNAME=%s\n' "$SECRET_DB_USERNAME"
            printf 'DB_PASSWORD=%s\n' "$SECRET_DB_PASSWORD"
            printf 'API_ADMIN_USER=%s\n' "$SECRET_API_ADMIN_USER"
            printf 'API_ADMIN_PASSWORD=%s\n' "$SECRET_API_ADMIN_PASSWORD"
            printf 'API_USER=%s\n' "$SECRET_API_USER"
            printf 'API_USER_PASSWORD=%s\n' "$SECRET_API_USER_PASSWORD"
            printf 'IMAGE_NAME=%s\n' "$IMAGE_NAME"
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG"
          } > .env

      - name: Subir ambiente de producao
        run: docker compose --profile production up -d --no-build app-production

      - name: Aguardar e validar producao
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8082/actuator/health | grep -q '"status":"UP"'; then
              echo "Producao UP"
              exit 0
            fi
            sleep 10
          done
          docker compose --profile production logs app-production
          exit 1

      - name: Salvar logs de producao
        if: always()
        run: |
          mkdir -p artifacts
          docker compose --profile production logs --no-color app-production > artifacts/production.log || true

      - name: Publicar logs de producao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-logs
          path: artifacts/production.log

      - name: Encerrar ambiente de producao
        if: always()
        run: docker compose --profile production down || true
