spring.application.name=esgapi
server.port=${SERVER_PORT:8080}

# Banco Oracle - credenciais obrigatoriamente via variaveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=false

# Spring Security HTTP Basic
api.security.admin-user=${API_ADMIN_USER:admin}
api.security.admin-password=${API_ADMIN_PASSWORD:admin123}
api.security.user=${API_USER:usuario}
api.security.user-password=${API_USER_PASSWORD:usuario123}

# Observabilidade
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true
info.app.name=Conecta Solidaria ESG API
info.app.description=API REST ESG para apoio comunitario
info.app.version=@project.version@
